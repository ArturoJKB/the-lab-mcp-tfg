[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thelab"
version = "0.1.0"
description = "Local-first Data-to-Model Factory"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2",
    "pandas>=2",
    "scikit-learn>=1.4",
    "mcp>=1.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kagglehub[pandas-datasets]>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
thelab = "thelab.cli:main"
thelab-data-catalog-mcp = "thelab.mcp.data_catalog_mcp:main_sync"
thelab-model-registry-mcp = "thelab.mcp.model_registry_mcp:main_sync"
thelab-workspace-mcp = "thelab.mcp.workspace_mcp:main_sync"
thelab-model-service = "thelab.model_service.cli:main"
thelab-context-mcp = "thelab.mcp.context_mcp:main_sync"
thelab-eda-mcp = "thelab.mcp.eda_mcp:main_sync"
thelab-context-write-mcp = "thelab.mcp.context_write_mcp:main_sync"
thelab-mcp-demo = "thelab.mcp.demo_client:main_sync"
thelab-agent = "thelab.agents.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "\\.venv",
    "build",
    "dist",
]
